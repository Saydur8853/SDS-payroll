<main class="page">
  <section class="panel">
    <h1>Company Info</h1>

    <div class="basic-info-media-layout">
      <div class="field-grid flex-1">
        <label>
          <span class="label-text">Company Name <span class="required-star">*</span></span>
          <input type="text" [(ngModel)]="name" placeholder="Enter company name" />
        </label>

        <label>
          <span class="label-text">Company Address <span class="required-star">*</span></span>
          <input type="text" [(ngModel)]="address" placeholder="Full address" />
        </label>

        <label>
          <span class="label-text">Logo URL (optional)</span>
          <input type="text" [(ngModel)]="logoUrl" [disabled]="selectedLogoFile !== null" placeholder="https://..." />
        </label>
      </div>

      <div class="media-column">
        <div class="image-preview" [class.empty]="!logoBase64">
          <img *ngIf="logoBase64" [src]="logoBase64" alt="Logo Preview" />
          <div *ngIf="!logoBase64" class="placeholder">
            <span class="material-symbols-rounded">business</span>
          </div>
          <div class="image-overlay" *ngIf="logoBase64">
            <button class="btn tiny icon-btn danger" (click)="removeLogo(false)">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </div>
        </div>
        <label class="btn tiny primary upload-btn">
          <span class="material-symbols-rounded">upload</span> Upload Logo
          <input type="file" (change)="onLogoFileSelected($event, false)" accept="image/*" hidden />
        </label>
      </div>
    </div>

    <div class="dynamic-header">
      <h2>Dynamic Attributes</h2>
      <button type="button" class="btn secondary" (click)="addDynamicAttributeRow()">Add Attribute</button>
    </div>
    <div class="dynamic-list">
      <div class="dynamic-row" *ngFor="let entry of dynamicEntries; let i = index">
        <div class="key-field">
          <input
            type="text"
            placeholder="Attribute key (e.g. Industry)"
            [(ngModel)]="entry.key"
            (input)="onAttributeKeyInput(i)"
            [attr.list]="'attribute-suggestions-' + i" />
          <datalist [id]="'attribute-suggestions-' + i">
            <option *ngFor="let suggestion of attributeSuggestionsByRow[i]" [value]="suggestion"></option>
          </datalist>
          <div class="suggestion-chips" *ngIf="entry.key && attributeSuggestionsByRow[i]?.length">
            <button
              type="button"
              class="chip"
              *ngFor="let suggestion of attributeSuggestionsByRow[i]"
              (click)="applySuggestion(i, suggestion)">
              {{ suggestion }}
            </button>
          </div>
        </div>
        <input type="text" placeholder="Value (e.g. Garments)" [(ngModel)]="entry.value" />
        <button type="button" class="btn secondary" (click)="removeDynamicAttributeRow(i)">Remove</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" [disabled]="isSaving" (click)="saveCompany()">
        {{ isSaving ? 'Saving...' : 'Save Company' }}
      </button>
    </div>

    <p class="message">{{ message }}</p>
  </section>

  <section class="panel">
    <h2>Companies</h2>

    <div class="company-card" *ngFor="let company of companies">
      <div class="company-header">
        <div>
          <h3>{{ company.name }}</h3>
          <p>{{ company.address }}</p>
        </div>
        <div class="company-actions">
          <button type="button" class="btn tiny secondary" (click)="startEdit(company)">Edit</button>
          <button
            type="button"
            class="btn tiny danger"
            [disabled]="deletingCompanyId === company.id"
            (click)="deleteCompany(company)">
            {{ deletingCompanyId === company.id ? 'Deleting...' : 'Delete' }}
          </button>
          <button
            type="button"
            class="btn tiny"
            [ngClass]="getStatusButtonClass(company)"
            [disabled]="updatingCompanyId === company.id"
            (click)="toggleCompanyStatus(company)">
            {{ getCompanyStatus(company) }}
          </button>
        </div>
      </div>

      <div class="edit-panel" *ngIf="editingCompanyId === company.id">
        <div class="basic-info-media-layout">
          <div class="field-grid flex-1">
            <label>
              <span class="label-text">Company Name <span class="required-star">*</span></span>
              <input type="text" [(ngModel)]="editName" placeholder="Company name" />
            </label>
            <label>
              <span class="label-text">Company Address <span class="required-star">*</span></span>
              <input type="text" [(ngModel)]="editAddress" placeholder="Company address" />
            </label>
            <label>
              <span class="label-text">Logo URL (optional)</span>
              <input type="text" [(ngModel)]="editLogoUrl" placeholder="Logo URL" />
            </label>
          </div>

          <div class="media-column">
            <div class="image-preview" [class.empty]="!editLogoBase64">
              <img *ngIf="editLogoBase64" [src]="editLogoBase64" alt="Logo Preview" />
              <div *ngIf="!editLogoBase64" class="placeholder">
                <span class="material-symbols-rounded">business</span>
              </div>
              <div class="image-overlay" *ngIf="editLogoBase64">
                <button class="btn tiny icon-btn danger" (click)="removeLogo(true)">
                  <span class="material-symbols-rounded">delete</span>
                </button>
              </div>
            </div>
            <label class="btn tiny primary upload-btn">
              <span class="material-symbols-rounded">upload</span> Change Logo
              <input type="file" (change)="onLogoFileSelected($event, true)" accept="image/*" hidden />
            </label>
          </div>
        </div>

        <div class="edit-dynamic-list mt-4">
          <h4>Dynamic Attributes</h4>
          <div class="edit-dynamic-row" *ngFor="let entry of editDynamicEntries; let idx = index">
            <input type="text" [(ngModel)]="entry.key" placeholder="Attribute key" />
            <input type="text" [(ngModel)]="entry.value" placeholder="Attribute value" />
            <button type="button" class="btn tiny danger icon-btn" (click)="removeEditDynamicAttributeRow(idx)">
              <span class="material-symbols-rounded" style="font-size:16px">close</span>
            </button>
          </div>
          <button type="button" class="btn tiny secondary" (click)="addEditDynamicAttributeRow()">
            <span class="material-symbols-rounded" style="font-size:16px">add</span> Add Attribute
          </button>
        </div>
        <div class="edit-actions">
          <button type="button" class="btn tiny primary" [disabled]="updatingCompanyId === company.id" (click)="saveEdit(company)">
            <span class="material-symbols-rounded" style="font-size:16px">save</span> Save
          </button>
          <button type="button" class="btn tiny secondary" (click)="cancelEdit()">Cancel</button>
        </div>
      </div>

      <div class="company-body">
        <div class="card-logo" *ngIf="company.logoBase64 || company.logoUrl">
          <img [src]="getLogoUrl(company)" alt="Company Logo" />
        </div>
        <div class="card-details">
          <ul>
            <li *ngFor="let item of company.dynamicAttributes | keyvalue">
              <span><strong>{{ item.key }}:</strong> {{ getDisplayAttributeValue(item.key, item.value) }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>
</main>
